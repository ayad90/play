<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP PLAYER</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* NATIVE APP FEEL CSS */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #ffffff; /* Page Background White */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER - Looks like a real App Bar */
        .app-header {
            height: 56px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: #fff;
            gap: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .app-header i { font-size: 1.2rem; cursor: pointer; color: #ff9900; }
        .app-header span { font-weight: bold; font-size: 1.1rem; letter-spacing: 0.5px; }

        /* VIDEO AREA - Perfectly Centered Black Box */
        .video-section {
            flex: 1; /* Takes all available space */
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        video {
            width: 100%;
            max-height: 100%;
            display: block;
            outline: none;
        }

        /* ACTION BUTTONS - Professional UI */
        .action-footer {
            background: #ffffff;
            padding: 20px;
            display: flex;
            gap: 15px;
            border-top: 1px solid #eee;
        }

        .btn {
            flex: 1;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-sh { background: #f0f2f5; color: #1c1e21; border: 1px solid #ddd; }
        .btn-dl { background: #1f80e0; color: #fff; box-shadow: 0 4px 12px rgba(31,128,224,0.3); }
        .btn:active { transform: scale(0.96); }

        /* NATIVE LOADER */
        #loader {
            position: absolute;
            width: 45px; height: 45px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #1f80e0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 5;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="app-header">
        <i class="fas fa-chevron-left" onclick="window.history.back()"></i>
        <span>VIP SECURE PLAYER</span>
    </div>

    <!-- Video Container -->
    <div class="video-section">
        <div id="loader"></div>
        <video id="vPlayer" controls playsinline poster="" onplaying="document.getElementById('loader').style.display='none'">
            <source id="vSource" src="" type="video/mp4">
        </video>
    </div>

    <!-- Buttons -->
    <div class="action-footer">
        <button class="btn btn-sh" onclick="nativeShare()">
            <i class="fas fa-share-alt"></i> SHARE
        </button>
        
        <a id="dlLink" href="#" class="btn btn-dl">
            <i class="fas fa-cloud-download-alt"></i> DOWNLOAD
        </a>
    </div>

    <script>
        // SMART URL PARSING
        const params = new URLSearchParams(window.location.search);
        let v = params.get('v'); 
        let p = params.get('p'); 

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');
        const dlLink = document.getElementById('dlLink');

        if(v) {
            v = decodeURIComponent(v);
            let finalUrl = v;

            // Auto-Convert to Direct Stream
            if(v.includes('dropbox.com')) {
                finalUrl = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            if(v.includes('pixeldrain.com/u/')) {
                finalUrl = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
            }

            source.src = finalUrl;
            dlLink.href = finalUrl;
            player.load();
        }

        if(p) player.poster = decodeURIComponent(p);

        // Native Sharing Logic
        function nativeShare() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'Exclusive Video', url: url });
            } else {
                const tmp = document.createElement('textarea');
                tmp.value = url;
                document.body.appendChild(tmp);
                tmp.select();
                document.execCommand('copy');
                document.body.removeChild(tmp);
                alert("Link copied!");
            }
        }
    </script>
</body>
</html>
