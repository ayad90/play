<!DOCTYPE html>
<html lang="en">
<head>

    <title>VIP PLAYER</title>
    <!-- Icons Support -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Poori screen ko safed aur center karne ke liye */
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #ffffff; /* Background White */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;    /* Vertical Center */
            justify-content: center; /* Horizontal Center */
            overflow: hidden;
        }

        /* Main Wrapper jo screen ke beech mein rahega */
        .player-card {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        /* Video Area */
        .video-box {
            width: 100%;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 16/9; /* Video ka standard ratio */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Buttons Row - Side by Side */
        .button-container {
            display: flex;
            padding: 20px;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-share { background: #f0f2f5; color: #1c1e21; border: 1px solid #ddd; }
        .btn-download { background: #007bff; color: #fff; box-shadow: 0 4px 10px rgba(0,123,255,0.2); }
        .btn:active { transform: scale(0.95); }

        /* Loader */
        #loader {
            position: absolute;
            width: 35px; height: 35px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Center Player -->
        <div class="video-box">
            <div id="loader"></div>
            <video id="vPlayer" controls playsinline poster="" onplaying="document.getElementById('loader').style.display='none'">
                <source id="vSource" src="" type="video/mp4">
            </video>
        </div>

        <!-- Single Line Buttons -->
        <div class="button-container">
            <button class="btn btn-share" onclick="shareNow()">
                <i class="fas fa-share-alt"></i> SHARE
            </button>
            
            <a id="dlLink" href="#" class="btn btn-download">
                <i class="fas fa-download"></i> DOWNLOAD
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let v = params.get('v'); 
        let p = params.get('p'); 

        const vPlayer = document.getElementById('vPlayer');
        const vSource = document.getElementById('vSource');
        const dlLink = document.getElementById('dlLink');

        if(v) {
            v = decodeURIComponent(v);
            let final = v;

            if(v.includes('dropbox.com')) {
                final = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            if(v.includes('pixeldrain.com/u/')) {
                final = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
            }

            vSource.src = final;
            dlLink.href = final;
            vPlayer.load();
        }

        if(p) vPlayer.poster = decodeURIComponent(p);

        function shareNow() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'VIP Video', url: url });
            } else {
                const t = document.createElement('textarea');
                t.value = url;
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                document.body.removeChild(t);
                alert("Link Copied!");
            }
        }
    </script>
</body>
</html>
