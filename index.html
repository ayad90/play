<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP PREMIUM PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #ff9900; --bg: #000; }
        body, html { margin:0; padding:0; background: var(--bg); color:#fff; overflow-x:hidden; font-family: sans-serif; }
        
        .ad-container { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; }
        .ad-box { width: 320px; height: 50px; background: #050505; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px solid #111; }

        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-top: 1px solid #222; border-bottom: 1px solid #222; box-shadow: 0 0 25px rgba(255, 153, 0, 0.2); }
        #video-container { width: 100%; height: 100%; }
        video, iframe { width: 100%; height: 100%; border: none; display: block; }

        .action-area { padding: 25px 20px; text-align: center; }
        .premium-btn { 
            display: flex; align-items: center; justify-content: center; gap: 12px;
            background: linear-gradient(45deg, #ff9900, #ffcc00); 
            color: #000; padding: 18px; border-radius: 12px; 
            text-decoration: none; font-weight: 900; font-size: 1.1rem; 
            box-shadow: 0 8px 25px rgba(255,153,0,0.4); 
        }
    </style>
</head>
<body>

    <!-- TOP ADS -->
    <div class="ad-container">
        <div class="ad-box">
            <script type="text/javascript">
                atOptions = { 'key' : '47a243b5b57a4107b0bfa58be36d1997', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/47a243b5b57a4107b0bfa58be36d1997/invoke.js"></script>
        </div>
    </div>

    <!-- DYNAMIC PLAYER -->
    <div class="player-wrapper" id="player-wrapper">
        <div id="video-container">
            <!-- Video ya Iframe yahan load hoga -->
        </div>
    </div>

    <!-- DOWNLOAD BUTTON -->
    <div class="action-area">
        <a id="dlBtn" href="https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739" class="premium-btn">
            <i class="fas fa-crown"></i> DOWNLOAD FULL HD VIDEO
        </a>
    </div>

    <!-- BOTTOM ADS -->
    <div class="ad-container">
        <div class="ad-box">
            <script type="text/javascript">
                atOptions = { 'key' : '47a243b5b57a4107b0bfa58be36d1997', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/47a243b5b57a4107b0bfa58be36d1997/invoke.js"></script>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 
        let p = urlParams.get('p'); 
        const container = document.getElementById('video-container');

        if(v) {
            v = decodeURIComponent(v);
            
            // 1. XVIDEOS AUTO-CONVERTER
            if(v.includes('xvideos.com')) {
                let match = v.match(/video(\d+)/);
                if(match) {
                    let id = match[1];
                    container.innerHTML = `<iframe src="https://www.xvideos.com/embedframe/${id}" allowfullscreen></iframe>`;
                }
            } 
            // 2. DROPBOX FIX
            else if(v.includes('dropbox.com')) {
                v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                container.innerHTML = `<video id="vPlayer" controls autoplay playsinline poster="${p}"><source src="${v}" type="video/mp4"></video>`;
            }
            // 3. PIXELDRAIN FIX
            else if(v.includes('pixeldrain.com/u/')) {
                v = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
                container.innerHTML = `<video id="vPlayer" controls autoplay playsinline poster="${p}"><source src="${v}" type="video/mp4"></video>`;
            }
            // 4. GENERAL MP4 OR OTHER EMBEDS
            else if(v.match(/\.(mp4|mkv|webm)/)) {
                container.innerHTML = `<video id="vPlayer" controls autoplay playsinline poster="${p}"><source src="${v}" type="video/mp4"></video>`;
            }
            else {
                container.innerHTML = `<iframe src="${v}" allowfullscreen></iframe>`;
            }
        }
    </script>
</body>
</html>
