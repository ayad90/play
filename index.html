<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP REDIRECTOR</title>
    <style>
        /* 1. BACKGROUND WHITE & CLEAN */
        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Connecting to Secure Server...</p>

    <script>
        // URL se video link nikalna
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 

        if(v) {
            let originalLink = decodeURIComponent(v);

            // Auto Fix for Adult Sites (Ensure Embed for better view)
            if(originalLink.includes('xvideos.com') && !originalLink.includes('embedframe')) {
                let vidId = originalLink.match(/video(\d+)/);
                if(vidId) originalLink = `https://www.xvideos.com/embedframe/${vidId[1]}`;
            }
            if(originalLink.includes('xhamster.com/videos') && !originalLink.includes('embed')) {
                let vidId = originalLink.split('-').pop();
                if(vidId) originalLink = `https://xhamster.com/embed/${vidId}`;
            }
            // Dropbox Fix
            if(originalLink.includes('dropbox.com')) {
                originalLink = originalLink.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '') + '?raw=1';
            }

            // --- REDIRECT LOGIC ---
            // 1.5 second ke baad user ko original video par bhej dega
            setTimeout(() => {
                window.location.href = originalLink;
            }, 1500);
        } else {
            document.body.innerHTML = "<h1>Invalid Link</h1>";
        }
    </script>
</body>
</html>
