<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP PLAYER</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; 
            background: #ffffff; /* Poora background white */
            font-family: sans-serif;
        }

        /* Video Container - No fixed height to avoid overlap */
        .video-box {
            width: 100%;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        video {
            width: 100%;
            max-height: 60vh; /* Screen height ka 60% max */
            display: block;
            background: #000;
        }

        /* Buttons Container */
        .controls-area {
            padding: 20px;
            background: #ffffff;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 5px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        /* Share Button (Grayish) */
        .btn-sh { background: #f1f2f6; color: #333; border: 1px solid #ddd; }
        
        /* Download Button (Blue) */
        .btn-dl { background: #007bff; color: #fff; box-shadow: 0 4px 10px rgba(0,123,255,0.2); }

        #loader {
            position: absolute;
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="video-box">
        <div id="loader"></div>
        <video id="vPlayer" controls playsinline poster="" onplaying="document.getElementById('loader').style.display='none'">
            <source id="vSource" src="" type="video/mp4">
        </video>
    </div>

    <div class="controls-area">
        <div class="btn-row">
            <!-- SHARE -->
            <button class="btn btn-sh" onclick="shareVideo()">
                <i class="fas fa-share-alt"></i> SHARE
            </button>
            
            <!-- DOWNLOAD -->
            <a id="downloadLink" href="#" class="btn btn-dl">
                <i class="fas fa-download"></i> DOWNLOAD
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 
        let p = urlParams.get('p'); 

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');
        const dlBtn = document.getElementById('downloadLink');

        if(v) {
            v = decodeURIComponent(v);
            let finalLink = v;

            if(v.includes('dropbox.com')) {
                finalLink = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            if(v.includes('pixeldrain.com/u/')) {
                finalLink = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
            }

            source.src = finalLink;
            dlBtn.href = finalLink;
            player.load();
        }

        if(p) player.poster = decodeURIComponent(p);

        function shareVideo() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'VIP Video', url: url });
            } else {
                const el = document.createElement('textarea');
                el.value = url;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                alert("Link Copied!");
            }
        }
    </script>
</body>
</html>
