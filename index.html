<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP FAST UNLOCK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #ffffff; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; text-align: center; }
        .container { padding: 20px; max-width: 400px; }
        .icon-box { font-size: 5rem; color: #007bff; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        h2 { font-size: 1.8rem; color: #111; margin: 10px 0; }
        p { color: #666; margin-bottom: 30px; font-size: 1.1rem; }
        .unlock-btn {
            background: #007bff; color: #fff; padding: 20px; border-radius: 15px; border: none;
            cursor: pointer; font-weight: 800; font-size: 1.3rem; width: 100%;
            box-shadow: 0 10px 20px rgba(0,123,255,0.3); transition: 0.2s;
        }
        .unlock-btn:active { transform: scale(0.95); }
        #status { margin-top: 20px; font-size: 0.9rem; color: #ff9900; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box"><i class="fas fa-play-circle"></i></div>
        <h2>Server is Ready</h2>
        <p>Click below to start high-speed streaming instantly.</p>

        <button id="unlockBtn" class="unlock-btn" onclick="handleUnlock()">
            FAST UNLOCK & PLAY
        </button>
        
        <div id="status">⚡ Unlocking Secure Stream...</div>
    </div>

    <script>
        const MY_AD_LINK = "https://omg10.com/4/10632629";
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 

        function handleUnlock() {
            const btn = document.getElementById('unlockBtn');
            const status = document.getElementById('status');

            // --- TRICK: OPEN AD IN NEW TAB ---
            window.open(MY_AD_LINK, '_blank');

            // --- IMMEDIATELY START REDIRECT ON MAIN PAGE ---
            btn.style.display = "none";
            status.style.display = "block";

            setTimeout(() => {
                if(v) {
                    let videoUrl = decodeURIComponent(v);

                    // Auto-fixers
                    if(videoUrl.includes('dropbox.com')) {
                        videoUrl = videoUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                    }
                    if(videoUrl.includes('xvideos.com') && !videoUrl.includes('embedframe')) {
                        let id = videoUrl.match(/video(\d+)/);
                        if(id) videoUrl = `https://www.xvideos.com/embedframe/${id[1]}`;
                    }

                    // User ko actual video par bhej do bina ad khatam hone ka wait kiye
                    window.location.href = videoUrl;
                }
            }, 1000); // Sirf 1 second ka gap taaki ad click count ho jaye
        }
    </script>
</body>
</html>
