        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(to right, #ff9900, #ffcc00); color: #000; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 900; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="ad-stack">
        <div class="ad-unit">
            <script type="text/javascript">atOptions = {'key' : '47a243b5b57a4107b0bfa58be36d1997','format' : 'iframe','height' : 50,'width' : 320,'params' : {}};</script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/47a243b5b57a4107b0bfa58be36d1997/invoke.js"></script>
        </div>
    </div>

    <div class="video-container" id="playerBox">
        <video id="vPlayer" controls playsinline></video>
        <!-- SANDBOX ADDED: allow-top-navigation HATA DIYA HAI TAAKI REDIRECT NA HO -->
        <iframe id="vIframe" sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin allow-presentation" allowfullscreen allow="autoplay"></iframe>
    </div>

    <div class="dl-box">
        <a id="dlBtn" href="https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739" class="btn">
            <i class="fas fa-bolt"></i> DOWNLOAD FULL HD
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v');
        const vPlayer = document.getElementById('vPlayer');
        const vIframe = document.getElementById('vIframe');

        if(v) {
            v = decodeURIComponent(v);
            if(v.includes('xvideos.com')) {
                let xid = v.match(/video(\d+)/);
                if(xid) { vIframe.src = "https://www.xvideos.com/embedframe/" + xid[1]; vIframe.style.display = "block"; }
            } 
            else if(v.includes('xhamster.com')) {
                let xhid = v.match(/videos\/.*-(xh\w+)/) || v.match(/videos\/(xh\w+)/);
                if(xhid) { vIframe.src = "https://xhamster.com/embed/" + xhid[1]; vIframe.style.display = "block"; }
            }
            else if(v.includes('dropbox.com') || v.includes('.mp4')) {
                if(v.includes('dropbox.com')) v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                vPlayer.src = v; vPlayer.style.display = "block";
            }
            else {
                vIframe.src = v.replace('/f/', '/e/').replace('/d/', '/e/').replace('/v/', '/e/');
                vIframe.style.display = "block";
            }
        }
    </script>
