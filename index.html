<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP SECURE PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin:0; padding:0; background:#000; height:100vh; width:100vw; overflow:hidden; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; }

        /* MASTER BACK BUTTON - ALWAYS ON TOP */
        #master-exit-btn { 
            position: fixed !important; 
            top: 15px !important; 
            left: 15px !important; 
            width: 45px !important; 
            height: 45px !important; 
            background: #ff9900 !important; 
            color: #000 !important; 
            border-radius: 50% !important; 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            z-index: 2147483647 !important; 
            cursor: pointer !important; 
            border: 2px solid #fff !important;
            box-shadow: 0 0 15px rgba(0,0,0,0.5) !important;
            font-size: 1.2rem !important;
        }

        /* CENTERED PLAYER */
        .video-container { width:100%; display: flex; align-items: center; justify-content: center; }
        video { width:100%; height:auto; max-height:100vh; display:block; outline:none; background:#000; }

        /* INTERSTITIAL AD OVERLAY */
        #ad-overlay { position: fixed; inset: 0; background: #000; z-index: 2147483640; display: none; flex-direction: column; }
        #ad-frame { flex: 1; border: none; width: 100%; height: 100%; background: #000; }
        
        /* SKIP TIMER UI */
        .skip-container { position: absolute; top: 15px; right: 15px; z-index: 2147483646; }
        .btn-skip { background: #fff; color: #000; padding: 10px 22px; border-radius: 30px; border: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .timer-txt { color: #fff; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; border: 1px solid #ff9900; font-weight: bold; }
    </style>
</head>
<body>

    <!-- MASTER BACK BUTTON -->
    <div id="master-exit-btn" onclick="goBackToApp()">
        <i class="fas fa-arrow-left"></i>
    </div>

    <!-- Video Player -->
    <div class="video-container">
        <video id="vPlayer" controls playsinline poster="">
            <source id="vSource" src="" type="video/mp4">
        </video>
    </div>

    <!-- Interstitial Ad Overlay -->
    <div id="ad-overlay">
        <div class="skip-container">
            <div id="timer-box" class="timer-txt">Please wait <span id="count">5</span>s</div>
            <button id="skip-btn" class="btn-skip" onclick="closeAd()">SKIP AD & RESUME &times;</button>
        </div>
        <iframe id="ad-frame" src=""></iframe>
    </div>

    <script>
        function goBackToApp() { window.history.back(); }

        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 
        let p = urlParams.get('p'); 
        
        // --- 🟢 AD CONFIG: APNA DIRECT LINK YAHAN DALEIN ---
        const directLink = "https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739";

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');
        const overlay = document.getElementById('ad-overlay');

        if(v) {
            v = decodeURIComponent(v);
            if(v.includes('dropbox.com')) v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            if(v.includes('pixeldrain.com/u/')) v = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
            source.src = v;
        }
        if(p) player.poster = decodeURIComponent(p);
        player.load();

        // --- 🕒 SMART MID-ROLL AD LOGIC ---
        let adTriggered = false;

        player.ontimeupdate = function() {
            // Agar video 60 seconds (1 minute) se zyada chal gayi hai
            if (player.currentTime >= 60 && !adTriggered) {
                triggerMidRollAd();
            }
        };

        function triggerMidRollAd() {
            adTriggered = true; // Taaki baar-baar na khule
            player.pause(); // Video roko
            
            overlay.style.display = "flex";
            document.getElementById('ad-frame').src = directLink;

            let timeLeft = 5;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('count').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById('timer-box').style.display = "none";
                    document.getElementById('skip-btn').style.display = "block";
                }
            }, 1000);
        }

        function closeAd() {
            overlay.style.display = "none";
            document.getElementById('ad-frame').src = "";
            player.play(); // Video wahi se shuru karo
        }

        // Keep Back Button on top
        setInterval(() => {
            document.getElementById('master-exit-btn').style.zIndex = "2147483647";
        }, 500);
    </script>
</body>
</html>
