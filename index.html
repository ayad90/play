    </div>

    <script>
        // Getting parameters from Admin Panel
        const urlParams = new URLSearchParams(window.location.search);
        let vUrl = decodeURIComponent(urlParams.get('v') || '');
        let pUrl = decodeURIComponent(urlParams.get('p') || '');
        let vTitle = decodeURIComponent(urlParams.get('t') || 'PREMIUM VIDEO');

        document.getElementById('vPoster').src = pUrl || 'https://i.ibb.co/L6V2Sny/placeholder.png';
        document.getElementById('vTitle').innerText = vTitle;

        // --- MONETAG REWARDED INTERSTITIAL LOGIC ---
        function triggerMoneTagAd() {
            document.getElementById('loader').style.display = 'flex';
            
            // Checking if your specific SDK function exists
            if (typeof show_10883203 === 'function') {
                show_10883203().then(() => {
                    // This runs AFTER user watches/clicks the ad
                    startActualVideo();
                }).catch((e) => {
                    // Fail-safe: if ad fails, still let them watch
                    console.log("Ad skipped or failed", e);
                    startActualVideo();
                });
            } else {
                // If SDK not loaded
                startActualVideo();
            }
        }

        function startActualVideo() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('vPoster').style.display = 'none';
            document.getElementById('playBtn').style.display = 'none';
            
            const container = document.getElementById('video-container');
            
            // Auto-fix for common servers
            if(vUrl.includes('dropbox.com')) vUrl = vUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
            if(vUrl.includes('pixeldrain.com/u/')) vUrl = 'https://pixeldrain.com/api/file/' + vUrl.split('/').pop();

            if(vUrl.includes('.mp4') || vUrl.includes('dropbox') || vUrl.includes('pixeldrain')) {
                container.innerHTML = `<video controls autoplay style="width:100%; height:100%; display:block;"><source src="${vUrl}" type="video/mp4"></video>`;
            } else {
                // For Lulu, Filemoon, etc.
                let embed = vUrl.replace('/f/', '/e/').replace('/d/', '/e/').replace('/v/', '/e/');
                container.innerHTML = `<iframe src="${embed}" style="width:100%; height:100%; display:block;" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            }
        }
    </script>
