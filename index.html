    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP PREMIUM PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CENTERED PREMIUM LAYOUT */
        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            color: #fff; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center; 
            justify-content: center; 
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 15px;
        }

        /* PLAYER DESIGN */
        .player-box {
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(31, 128, 224, 0.25);
            border: 1px solid #222;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 60vh;
            display: block;
            outline: none;
        }

        /* PREMIUM BUTTONS */
        .btn-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            padding: 18px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 900; 
            font-size: 1.1rem; 
            transition: 0.3s; 
            border: none; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-download { 
            background: linear-gradient(45deg, #ff9900, #ffcc00); 
            color: #000; 
            box-shadow: 0 8px 20px rgba(255, 153, 0, 0.4); 
        }
        
        .btn-next { 
            background: #1f80e0; 
            color: #fff;
            box-shadow: 0 8px 20px rgba(31, 128, 224, 0.4);
        }
        
        .action-btn:active { transform: scale(0.95); }

        .footer-tag {
            font-size: 0.7rem;
            color: #555;
            text-align: center;
            letter-spacing: 1px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- CENTERED PLAYER -->
        <div class="player-box">
            <video id="vPlayer" controls playsinline poster="">
                <source id="vSource" src="" type="video/mp4">
            </video>
        </div>

        <!-- EXTERNAL LINK BUTTONS -->
        <div class="btn-container">
            <!-- Button 1 -->
            <button onclick="openInChrome()" class="action-btn btn-download">
                <i class="fas fa-crown"></i> Download Video (4K HD)
            </button>

            <!-- Button 2 -->
            <button onclick="openInChrome()" class="action-btn btn-next">
                <i class="fas fa-forward"></i> Play Next Part
            </button>
        </div>

        <div class="footer-tag">SECURE HIGH-SPEED STREAMING</div>

    </div>

    <script>
        // ADSTERRA DIRECT LINK
        const directAdLink = "https://omg10.com/4/10632629";

        // FUNCTION TO FORCE OPEN IN CHROME/EXTERNAL
        function openInChrome() {
            // Using window.open with _blank and system trigger
            const win = window.open(directAdLink, '_blank');
            if (win) {
                win.focus();
            } else {
                // Fallback if popup blocked
                window.location.assign(directAdLink);
            }
        }

        // --- DATA LOADING & AUTO-FIX LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        let posterUrl = urlParams.get('p'); 

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');

        if(videoUrl) {
            videoUrl = decodeURIComponent(videoUrl);
            
            // 1. Dropbox Fix
            if(videoUrl.includes('dropbox.com')) {
                videoUrl = videoUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            // 2. Pixeldrain Fix
            if(videoUrl.includes('pixeldrain.com/u/')) {
                videoUrl = 'https://pixeldrain.com/api/file/' + videoUrl.split('/').pop();
            }
            
            source.src = videoUrl;
        }

        if(posterUrl) {
            player.poster = decodeURIComponent(posterUrl);
        }

        player.load();
    </script>
</body>
</html>
