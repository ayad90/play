<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP VIDEO UNLOCKER</title>
    <!-- Icons Support -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: sans-serif;
            text-align: center;
        }
        .container { padding: 20px; max-width: 400px; }
        .icon-box { font-size: 4.5rem; color: #28a745; margin-bottom: 20px; }
        h2 { margin: 10px 0; font-size: 1.6rem; color: #111; }
        p { color: #555; margin-bottom: 30px; line-height: 1.5; font-size: 1rem; }
        
        .unlock-btn {
            background: #28a745;
            color: #fff;
            padding: 18px 40px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 5px 15px rgba(40,167,69,0.3);
            width: 100%;
            text-decoration: none;
            transition: 0.3s;
        }
        .unlock-btn:active { transform: scale(0.96); }
        
        #status { margin-top: 25px; font-size: 0.95rem; color: #888; font-weight: 600; }
        .loader-dots { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2>Secure Player Locked</h2>
        <p>Click the button below to unlock the secure high-speed server and start watching in HD.</p>

        <!-- THIS BUTTON TRIGGERS YOUR AD + REDIRECT -->
        <button id="unlockBtn" class="unlock-btn" onclick="startUnlock()">
            <i class="fas fa-unlock-alt"></i> UNLOCK & PLAY HD
        </button>
        
        <p id="status">Verification Required to Play</p>
    </div>

    <script>
        // --- YOUR AD LINK SETTINGS ---
        const MY_AD_LINK = "https://omg10.com/4/10632629";

        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 

        function startUnlock() {
            const btn = document.getElementById('unlockBtn');
            const status = document.getElementById('status');

            // 1. Open your ad link in a new window
            window.open(MY_AD_LINK, '_blank');

            // 2. Change UI to show loading
            btn.disabled = true;
            btn.style.background = "#333";
            btn.innerHTML = "<i class='fas fa-circle-notch fa-spin'></i> Unlocking...";
            status.innerHTML = "Opening Secure Server... Wait 3 seconds";
            status.style.color = "#ff9900";

            // 3. Wait 3 seconds then redirect to the actual video
            setTimeout(() => {
                if(v) {
                    let videoUrl = decodeURIComponent(v);

                    // Automatic Fixes for common hosters
                    if(videoUrl.includes('dropbox.com')) {
                        videoUrl = videoUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                    }
                    if(videoUrl.includes('xvideos.com') && !videoUrl.includes('embedframe')) {
                        let idMatch = videoUrl.match(/video(\d+)/);
                        if(idMatch) videoUrl = `https://www.xvideos.com/embedframe/${idMatch[1]}`;
                    }

                    status.innerHTML = "Unlocked! Redirecting...";
                    status.style.color = "#28a745";
                    
                    // Final Redirect
                    window.location.href = videoUrl;
                } else {
                    status.innerHTML = "Error: Video link not found!";
                    status.style.color = "red";
                }
            }, 3000); // 3 seconds delay for ad registration
        }
    </script>
</body>
</html>
