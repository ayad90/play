    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v');
        let p = urlParams.get('p');
        const vPlayer = document.getElementById('vPlayer');
        const vIframe = document.getElementById('vIframe');

        if(v) {
            v = decodeURIComponent(v);
            
            // 1. XVIDEOS
            if(v.includes('xvideos.com')) {
                let id = v.split('/video')[1] ? v.split('/video')[1].split('/')[0] : "";
                vIframe.src = "https://www.xvideos.com/embedframe/" + id;
                vIframe.style.display = "block";
            } 
            // 2. XHAMSTER
            else if(v.includes('xhamster.com')) {
                let id = v.split('/videos/')[1] ? v.split('/videos/')[1].split('-').pop() : "";
                if(!id) id = v.split('/').pop();
                vIframe.src = "https://xhamster.com/embed/" + id;
                vIframe.style.display = "block";
            }
            // 3. DROPBOX / DIRECT MP4
            else if(v.includes('dropbox.com') || v.includes('.mp4')) {
                if(v.includes('dropbox.com')) v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                vPlayer.src = v;
                if(p) vPlayer.poster = decodeURIComponent(p);
                vPlayer.style.display = "block";
                vPlayer.load();
            }
            // 4. FALLBACK (Lulu, Filemoon, etc)
            else {
                vIframe.src = v.replace('/f/', '/e/').replace('/d/', '/e/').replace('/v/', '/e/');
                vIframe.style.display = "block";
            }
        }
    </script>
