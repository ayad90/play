    <style>

        .container { padding: 20px; max-width: 400px; }
        .icon-box { font-size: 4rem; color: #ff9900; margin-bottom: 20px; }
        h2 { margin: 10px 0; font-size: 1.5rem; color: #333; }

        .unlock-btn:active { transform: scale(0.98); }

<body>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-lock"></i>
        </div>
        <h2>Video is Locked</h2>
        <p>To watch this VIP Video, please watch a short ad to support our free server.</p>

        <!-- Triggers the Ad -->
        <button id="unlockBtn" class="unlock-btn" onclick="executeAd()">
            <i class="fas fa-play-circle"></i> WATCH AD & UNLOCK
        </button>
        
        <p id="status">Video will play automatically after ad</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 

        function executeAd() {
            const btn = document.getElementById('unlockBtn');
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Loading Ad...";
            
            // --- YOUR MONETAG REWARDED CALL ---
            if (typeof show_10883203 === 'function') {
                show_10883203().then(() => {
                    // This runs AFTER the user watches the ad
                    unlockAndRedirect();
                }).catch((err) => {
                    // Fallback if ad fails or blocked
                    console.error("Ad error:", err);
                    unlockAndRedirect(); 
                });
            } else {
                // If script didn't load, bypass so user doesn't get stuck
                unlockAndRedirect();
            }
        }

        function unlockAndRedirect() {
            if(v) {
                let finalUrl = decodeURIComponent(v);

                // Auto-Fix for Dropbox/Adult sites
                if(finalUrl.includes('dropbox.com')) {
                    finalUrl = finalUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                }
                if(finalUrl.includes('xvideos.com') && !finalUrl.includes('embedframe')) {
                    let vidId = finalUrl.match(/video(\d+)/);
                    if(vidId) finalUrl = `https://www.xvideos.com/embedframe/${vidId[1]}`;
                }

                document.getElementById('status').innerHTML = "Success! Redirecting...";
                document.getElementById('status').style.color = "green";

                // Redirect user to the actual video content
                setTimeout(() => {
                    window.location.href = finalUrl;
                }, 1000);
            }
        }
    </script>
