<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP SMART PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CENTERED PREMIUM UI */
        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            color: #fff; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center; 
            justify-content: center; 
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 15px;
        }

        /* PLAYER BOX */
        .player-box {
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(31, 128, 224, 0.3);
            border: 1px solid #222;
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 60vh;
            display: block;
            outline: none;
        }

        /* RESUME TOAST NOTIFICATION */
        #resume-toast {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 128, 224, 0.9);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            display: none;
            z-index: 100;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

        /* PREMIUM BUTTONS */
        .btn-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            padding: 18px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 900; 
            font-size: 1.1rem; 
            transition: 0.3s; 
            border: none; 
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .btn-download { background: linear-gradient(45deg, #ff9900, #ffcc00); color: #000; box-shadow: 0 8px 20px rgba(255, 153, 0, 0.4); }
        .btn-next { background: #1f80e0; color: #fff; box-shadow: 0 8px 20px rgba(31, 128, 224, 0.4); }
        .action-btn:active { transform: scale(0.95); }

        .footer-tag { font-size: 0.7rem; color: #444; text-align: center; letter-spacing: 1px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="player-box">
            <div id="resume-toast">Resuming from where you left...</div>
            <video id="vPlayer" controls playsinline poster="">
                <source id="vSource" src="" type="video/mp4">
            </video>
        </div>

        <div class="btn-container">
            <button onclick="openInChrome()" class="action-btn btn-download">
                <i class="fas fa-crown"></i> Download Video (4K HD)
            </button>
            <button onclick="openInChrome()" class="action-btn btn-next">
                <i class="fas fa-forward"></i> Play Next Part
            </button>
        </div>

        <div class="footer-tag">AI-POWERED SMART RESUME PLAYER</div>

    </div>

    <script>
        const directAdLink = "https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739";

        function openInChrome() {
            window.open(directAdLink, '_blank');
        }

        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        let posterUrl = urlParams.get('p'); 

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');
        const toast = document.getElementById('resume-toast');

        if(videoUrl) {
            videoUrl = decodeURIComponent(videoUrl);
            
            if(videoUrl.includes('dropbox.com')) {
                videoUrl = videoUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            if(videoUrl.includes('pixeldrain.com/u/')) {
                videoUrl = 'https://pixeldrain.com/api/file/' + videoUrl.split('/').pop();
            }
            
            source.src = videoUrl;
            
            // --- SMART RESUME LOGIC ---
            // Unique key for each video based on its URL
            const storageKey = "progress_" + btoa(videoUrl).substring(0, 16);

            // 1. Load saved time
            player.addEventListener('loadedmetadata', function() {
                const savedTime = localStorage.getItem(storageKey);
                if (savedTime) {
                    player.currentTime = parseFloat(savedTime);
                    toast.style.display = "block";
                    setTimeout(() => { toast.style.display = "none"; }, 3000);
                }
            });

            // 2. Save current time periodically
            player.ontimeupdate = () => {
                if (player.currentTime > 5) { // Only save after 5 seconds of watching
                    localStorage.setItem(storageKey, player.currentTime);
                }
            };
            
            // 3. Mark as finished if video ends
            player.onended = () => {
                localStorage.removeItem(storageKey);
            };
        }

        if(posterUrl) player.poster = decodeURIComponent(posterUrl);
        player.load();
    </script>
</body>
</html>
