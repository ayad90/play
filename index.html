<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP SECURE PLAYER</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        /* Poori screen ko center karne ke liye */
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #ffffff; 
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertical Center */
            align-items: center;    /* Horizontal Center */
        }

        /* Video Area */
        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-wrapper {
            width: 100%;
            background: #000;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        video {
            width: 100%;
            max-height: 70vh;
            display: block;
        }

        /* Button Row */
        .action-bar {
            width: 100%;
            padding: 20px;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-share { background: #f0f2f5; color: #1c1e21; border: 1px solid #ddd; }
        .btn-download { background: #007bff; color: #fff; box-shadow: 0 4px 15px rgba(0,123,255,0.3); }
        .btn:active { transform: scale(0.95); }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 5;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- PLAYER -->
        <div class="video-wrapper">
            <div id="loader"></div>
            <video id="vPlayer" controls playsinline poster="" onplaying="document.getElementById('loader').style.display='none'">
                <source id="vSource" src="" type="video/mp4">
            </video>
        </div>

        <!-- BUTTONS -->
        <div class="action-bar">
            <button class="btn btn-share" onclick="copyAndShare()">
                <i class="fas fa-share-alt"></i> SHARE
            </button>
            
            <a id="dlLink" href="#" class="btn btn-download">
                <i class="fas fa-download"></i> DOWNLOAD
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let video = params.get('v'); 
        let poster = params.get('p'); 

        const vPlayer = document.getElementById('vPlayer');
        const vSource = document.getElementById('vSource');
        const dlLink = document.getElementById('dlLink');

        if(video) {
            video = decodeURIComponent(video);
            let finalUrl = video;

            // Smart Link Converter
            if(video.includes('dropbox.com')) {
                finalUrl = video.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            if(video.includes('pixeldrain.com/u/')) {
                finalUrl = 'https://pixeldrain.com/api/file/' + video.split('/').pop();
            }

            vSource.src = finalUrl;
            dlLink.href = finalUrl;
            vPlayer.load();
        }

        if(poster) vPlayer.poster = decodeURIComponent(poster);

        function copyAndShare() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'VIP Video', url: currentUrl });
            } else {
                const tmp = document.createElement('textarea');
                tmp.value = currentUrl;
                document.body.appendChild(tmp);
                tmp.select();
                document.execCommand('copy');
                document.body.removeChild(tmp);
                alert("Link Copied!");
            }
        }
    </script>
</body>
</html>
