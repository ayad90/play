<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP VIDEO UNLOCKER</title>
    <!-- Icons Support -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            background: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: sans-serif;
            text-align: center;
        }
        .container { padding: 20px; max-width: 400px; }
        .icon-box { font-size: 4rem; color: #ff9900; margin-bottom: 20px; }
        h2 { margin: 10px 0; font-size: 1.5rem; color: #333; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        
        .unlock-btn {
            background: #28a745;
            color: #fff;
            padding: 18px 40px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(40,167,69,0.3);
            width: 100%;
            text-decoration: none;
        }
        .unlock-btn:active { transform: scale(0.98); }
        #status { margin-top: 20px; font-size: 0.9rem; color: #888; font-weight: bold; }
        
        /* Ad Slot for extra income */
        .small-ad { width: 300px; height: 50px; margin-bottom: 20px; background: #f9f9f9; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-play-circle"></i>
        </div>
        <h2>Video Ready to Play</h2>
        <p>Click below to unlock the secure server and start watching in Full HD.</p>

        <!-- THIS BUTTON TRIGGERS AD + REDIRECT -->
        <button id="unlockBtn" class="unlock-btn" onclick="startUnlock()">
            <i class="fas fa-unlock-alt"></i> UNLOCK & PLAY HD
        </button>
        
        <p id="status">Secure redirection enabled</p>
    </div>

    <script>
        // 1. APNA DIRECT LINK YAHAN DALEIN
        const MY_DIRECT_LINK = "https://omg10.com/4/10632629;

        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 

        function startUnlock() {
            const btn = document.getElementById('unlockBtn');
            const status = document.getElementById('status');

            // --- STEP 1: OPEN DIRECT LINK IN NEW TAB ---
            window.open(MY_DIRECT_LINK, '_blank');

            // --- STEP 2: SHOW LOADING ON CURRENT PAGE ---
            btn.style.background = "#333";
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Unlocking Video...";
            status.innerHTML = "Opening secure server... Please wait 2 seconds.";
            status.style.color = "#ff9900";

            // --- STEP 3: REDIRECT TO VIDEO AFTER 2 SECONDS ---
            setTimeout(() => {
                if(v) {
                    let finalUrl = decodeURIComponent(v);

                    // Auto-Fix for Dropbox/Adult sites
                    if(finalUrl.includes('dropbox.com')) {
                        finalUrl = finalUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').split('?')[0] + '?raw=1';
                    }
                    if(finalUrl.includes('xvideos.com') && !finalUrl.includes('embedframe')) {
                        let vidId = finalUrl.match(/video(\d+)/);
                        if(vidId) finalUrl = `https://www.xvideos.com/embedframe/${vidId[1]}`;
                    }

                    status.innerHTML = "Success! Playing now...";
                    status.style.color = "green";
                    
                    window.location.href = finalUrl;
                }
            }, 2500); // 2.5 seconds wait taaki ad click register ho jaye
        }
    </script>
</body>
</html>
