<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP PREMIUM PLAYER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CLEAN DARK THEME */
        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            color: #fff; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center; /* Vertical Center */
            justify-content: center; /* Horizontal Center */
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px;
        }

        /* CENTERED VIDEO PLAYER */
        .player-box {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(31, 128, 224, 0.2);
            border: 1px solid #222;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 60vh;
            display: block;
            outline: none;
        }

        /* PREMIUM BUTTONS AREA */
        .btn-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            padding: 16px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1rem; 
            transition: 0.3s; 
            border: none; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Download Button (Orange Gradient) */
        .btn-download { 
            background: linear-gradient(to right, #ff9900, #ffcc00); 
            color: #000; 
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.3); 
        }
        /* Next Part Button (Blue) */
        .btn-next { 
            background: #1f80e0; 
            color: #fff;
            box-shadow: 0 5px 15px rgba(31, 128, 224, 0.3);
        }
        .action-btn:active { transform: scale(0.96); }

        /* Small Credits Text */
        .footer-text {
            font-size: 0.65rem;
            color: #444;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- THE CENTERED PLAYER -->
        <div class="player-box">
            <video id="vPlayer" controls playsinline poster="">
                <source id="vSource" src="" type="video/mp4">
            </video>
        </div>

        <!-- THE BUTTONS -->
        <div class="btn-container">
            <!-- 1. Download Button (Direct Link) -->
            <a href="https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739" class="action-btn btn-download">
                <i class="fas fa-file-download"></i> Download Video (4K HD)
            </a>

            <!-- 2. Next Part Button (Direct Link) -->
            <a href="https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739" class="action-btn btn-next">
                <i class="fas fa-step-forward"></i> Play Next Part
            </a>
        </div>

        <div class="footer-text">Secure Encrypted VIP Streaming</div>

    </div>

    <script>
        // --- DATA LOADING & AUTO-FIX LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        let posterUrl = urlParams.get('p'); 

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');

        if(videoUrl) {
            videoUrl = decodeURIComponent(videoUrl);
            
            // 1. Dropbox Fix
            if(videoUrl.includes('dropbox.com')) {
                videoUrl = videoUrl.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            // 2. Pixeldrain Fix
            if(videoUrl.includes('pixeldrain.com/u/')) {
                videoUrl = 'https://pixeldrain.com/api/file/' + videoUrl.split('/').pop();
            }
            
            source.src = videoUrl;
        }

        if(posterUrl) {
            player.poster = decodeURIComponent(posterUrl);
        }

        // Load and Ready
        player.load();
    </script>
</body>
</html>
