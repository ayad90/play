<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP PLAYER</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            background: #000; 
            height: 100vh; width: 100vw; 
            overflow: hidden; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        /* 1. CENTERED PLAYER (NO ADS) */
        .video-container { 
            width: 100%; 
            background: #000; 
            display: flex; justify-content: center; align-items: center;
        }
        video { 
            width: 100%; 
            height: auto; 
            max-height: 80vh; 
            display: block; 
            outline: none; 
            box-shadow: 0 0 30px rgba(31, 128, 224, 0.2);
        }

        /* 2. SUPPORT BUTTON SECTION */
        .support-area { 
            width: 100%; 
            padding: 20px; 
            text-align: center; 
            background: #000;
        }
        .support-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(45deg, #ff9900, #ffcc00);
            color: #000; padding: 15px 30px; border-radius: 50px;
            text-decoration: none; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 5px 20px rgba(255, 153, 0, 0.4);
            transition: 0.3s;
            text-transform: uppercase;
        }
        .support-btn:active { transform: scale(0.95); }
        .support-btn i { font-size: 1.3rem; }
    </style>
</head>
<body>

    <!-- Main Video Player -->
    <div class="video-container">
        <video id="vPlayer" controls playsinline poster="">
            <source id="vSource" src="" type="video/mp4">
            Your browser does not support video.
        </video>
    </div>

    <!-- Click & Support Us Button (Direct Link) -->
    <div class="support-area">
        <a id="supportBtn" href="https://omg10.com/4/10632629" target="_blank" class="support-btn">
            <i class="fas fa-heart"></i> CLICK & SUPPORT US
        </a>
        <p style="color: #444; font-size: 0.7rem; margin-top: 10px;">Support us to keep this service FREE forever!</p>
    </div>

    <script>
        // Automatic Data Loading from URL
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 
        let p = urlParams.get('p'); 

        const player = document.getElementById('vPlayer');
        const source = document.getElementById('vSource');

        if(v) {
            v = decodeURIComponent(v);
            
            // Auto Fix for Dropbox / Pixeldrain / Workers.dev
            if(v.includes('dropbox.com')) {
                v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            if(v.includes('pixeldrain.com/u/')) {
                v = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
            }

            source.src = v;
            player.load();
        }

        if(p) {
            player.poster = decodeURIComponent(p);
        }
    </script>
</body>
</html>
