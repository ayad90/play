    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #030b17; --primary: #1f80e0; --gold: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        .ad-unit { width: 320px; height: 50px; background: #050505; display: flex; justify-content: center; align-items: center; border: 1px solid #111; }

        /* PLAYER WRAPPER */
        #player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; border-top: 1px solid #222; border-bottom: 1px solid #222; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #vPoster { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; }
        #video-container { width: 100%; height: 100%; z-index: 2; display: none; }
        video, iframe { width: 100%; height: 100%; border: none; }

        .content-area { padding: 25px 20px; text-align: center; background: #030b17; }
        .v-title { font-size: 1rem; font-weight: bold; margin-bottom: 20px; color: #eee; text-transform: uppercase; }
        
        .action-btn { 
            width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 800; 
            font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; gap: 12px; transition: 0.3s; margin-bottom: 15px;

        }
        .btn-gold { background: var(--gold); color: #000; }

        .loader { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div class="ad-stack">
        <div class="ad-unit"><script type="text/javascript">atOptions={'key':'47a243b5b57a4107b0bfa58be36d1997','format':'iframe','height':50,'width':320};</script><script type="text/javascript" src="https://www.highperformanceformat.com/47a243b5b57a4107b0bfa58be36d1997/invoke.js"></script></div>
    </div>

    <div id="player-wrapper">
        <div id="loader" class="loader">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--primary);"></i>
            <p style="margin-top: 15px; font-weight: bold;">LOADING SECURE STREAM...</p>
        </div>
        <img id="vPoster" src="https://i.ibb.co/L6V2Sny/placeholder.png">
        <div id="video-container"></div>
    </div>

    <div class="content-area">
        <div id="vTitle" class="v-title">VIP PREMIUM VIDEO</div>
        
        <button id="playBtn" class="action-btn" onclick="triggerAd()">
            <i class="fas fa-play-circle"></i> WATCH FULL HD
        </button>

        <a id="dlBtn" href="https://www.effectivegatecpm.com/vwizjp7s?key=82eaaf585ed86a0767368d003252b739" class="action-btn btn-gold">
            <i class="fas fa-download"></i> DOWNLOAD NOW
        </a>
    </div>

    <div class="ad-stack">
        <div class="ad-unit"><script type="text/javascript">atOptions={'key':'47a243b5b57a4107b0bfa58be36d1997','format':'iframe','height':50,'width':320};</script><script type="text/javascript" src="https://www.highperformanceformat.com/47a243b5b57a4107b0bfa58be36d1997/invoke.js"></script></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let v = params.get('v') ? decodeURIComponent(params.get('v')) : "";
        let p = params.get('p') ? decodeURIComponent(params.get('p')) : "";
        let t = params.get('t') ? decodeURIComponent(params.get('t')) : "PREMIUM VIDEO";

        if(p) document.getElementById('vPoster').src = p;
        document.getElementById('vTitle').innerText = t;

        function triggerAd() {
            document.getElementById('loader').style.display = 'flex';
            
            // Check if show_10883203 exists (MoneTag)
            if (typeof show_10883203 === 'function') {
                show_10883203().then(() => {
                    playVideo();
                }).catch(() => {
                    playVideo(); // Play even if ad fails
                });
            } else {
                playVideo(); // Play if SDK not found
            }
        }

        function playVideo() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('vPoster').style.display = 'none';
            document.getElementById('playBtn').style.display = 'none';
            const container = document.getElementById('video-container');
            container.style.display = 'block';

            // Dropbox Logic Fix
            if(v.includes('dropbox.com')) {
                v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '').replace('?dl=1', '') + '?raw=1';
            }
            // Pixeldrain Fix
            if(v.includes('pixeldrain.com/u/')) {
                v = 'https://pixeldrain.com/api/file/' + v.split('/').pop();
            }

            if(v.includes('.mp4') || v.includes('dropbox') || v.includes('pixeldrain')) {
                container.innerHTML = `<video controls autoplay playsinline style="width:100%; height:100%;"><source src="${v}" type="video/mp4"></video>`;
            } else {
                // For other embeds like Filemoon, Lulu, etc.
                let embed = v.replace('/f/', '/e/').replace('/d/', '/e/').replace('/v/', '/e/');
                container.innerHTML = `<iframe src="${embed}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            }
        }
    </script>
</body>
</html>
