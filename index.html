<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>VIP SMART PLAYER</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; outline: none; }
    </style>
</head>
<body>

    <video id="vPlayer" controls autoplay playsinline>
        <source id="vSource" src="" type="video/mp4">
    </video>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let v = urlParams.get('v'); 
        let startTime = urlParams.get('t') || 0; // NEW: Get start time in seconds
        const player = document.getElementById('vPlayer');

        if(v) {
            v = decodeURIComponent(v);
            if(v.includes('dropbox.com')) v = v.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '') + '?raw=1';
            document.getElementById('vSource').src = v;
            player.load();
        }

        // --- SMART START TIME LOGIC ---
        player.addEventListener('loadedmetadata', function() {
            if(startTime > 0) {
                player.currentTime = parseFloat(startTime);
            }
        });
    </script>
</body>
</html>
